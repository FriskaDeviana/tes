<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 64px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: #2563eb;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 8px;
    }

    .nav-links a {
      display: block;
      padding: 8px 16px;
      color: #374151;
      text-decoration: none;
      font-weight: 500;
      border-radius: 8px;
      transition: background 0.2s, color 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: #eff6ff;
      color: #2563eb;
    }

    .nav-cta {
      padding: 8px 20px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .nav-cta:hover {
      background: #1d4ed8;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
    }

    .hamburger span {
      width: 26px;
      height: 3px;
      background: #374151;
      border-radius: 2px;
      transition: transform 0.3s, opacity 0.3s;
    }

    .hamburger.open span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }
    .hamburger.open span:nth-child(2) {
      opacity: 0;
    }
    .hamburger.open span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    /* Tampilan mobile */
    @media (max-width: 768px) {
      .hamburger {
        display: flex;
      }

      .nav-cta {
        display: none;
      }

      .nav-links {
        position: absolute;
        top: 64px;
        left: 0;
        right: 0;
        flex-direction: column;
        gap: 0;
        background: #ffffff;
        padding: 8px 24px 16px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
        max-height: 0;
        overflow: hidden;
        padding-top: 0;
        padding-bottom: 0;
        transition: max-height 0.3s ease, padding 0.3s ease;
      }

      .nav-links.open {
        max-height: 400px;
        padding-top: 8px;
        padding-bottom: 16px;
      }
    }

    /* Konten contoh */
    .content {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 24px;
      line-height: 1.7;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="#" class="logo">MyBrand</a>

    <ul class="nav-links" id="navLinks">
      <li><a href="#" class="active">Beranda</a></li>
      <li><a href="#">Tentang</a></li>
      <li><a href="#">Layanan</a></li>
      <li><a href="#">Portofolio</a></li>
      <li><a href="#">Kontak</a></li>
    </ul>

    <a href="#" class="nav-cta">Masuk</a>

    <button class="hamburger" id="hamburger" aria-label="Buka menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <main class="content">
    <h1>Halo, selamat datang!</h1>
    <p>Ini adalah contoh konten halaman. Coba perkecil lebar jendela browser untuk melihat menu hamburger bekerja.</p>
  </main>

  <script>
    const hamburger = document.getElementById("hamburger");
    const navLinks = document.getElementById("navLinks");

    hamburger.addEventListener("click", () => {
      hamburger.classList.toggle("open");
      navLinks.classList.toggle("open");
    });

    // Tutup menu saat link diklik (mobile)
    navLinks.querySelectorAll("a").forEach((link) => {
      link.addEventListener("click", () => {
        hamburger.classList.remove("open");
        navLinks.classList.remove("open");
      });
    });
  </script>

</body>
</html>
